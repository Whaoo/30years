<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vol du soir</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
/* Plein cadre : la scène 3D rendue en basse résolution (palette + tramage), étiquettes en haut, barre de commandes en bas,
   cartes d'accueil et de résultats par-dessus. Un seul look sombre, quel que soit le thème de l'appareil. */
:root {
  --ink: #12141c;          /* barre, étiquettes, cartes */
  --line: #2c3040;
  --paper: #e9e4ee;        /* texte clair */
  --soft: #c9c4d6;
  --muted: #8d8aa0;
  --amber: #f2b24c;        /* accent : la verrière, les touches, les anneaux */
  --holly: #d8323a;        /* Noël */
  --haze: #d4bcc8;
  --pixel: 'Silkscreen', 'IBM Plex Mono', ui-monospace, monospace;
  --mono: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
[hidden] { display: none !important; }
body { background: var(--ink); color: var(--paper); overflow: hidden; font-family: var(--mono); }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--ink); }
#stage { position: relative; flex: 1 1 auto; min-height: 0; overflow: hidden; background: var(--haze); cursor: crosshair; touch-action: none; user-select: none; -webkit-user-select: none; }
#stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; image-rendering: crisp-edges; }
#hud { pointer-events: none; }

.tag { position: absolute; top: max(6px, env(safe-area-inset-top, 0px)); display: flex; align-items: center; gap: 6px; padding: 3px 6px 2px; background: rgba(18, 20, 28, 0.62); color: var(--paper); font: 400 8px/1 var(--pixel); letter-spacing: 0; text-transform: uppercase; pointer-events: none; }
.tag.tl { left: max(6px, env(safe-area-inset-left, 0px)); pointer-events: auto; cursor: pointer; border: 0; }
.tag.tr { right: max(6px, env(safe-area-inset-right, 0px)); font-variant-numeric: tabular-nums; }
.tag.tc { left: 50%; transform: translateX(-50%); gap: 10px; padding: 4px 9px 3px; font-size: 8px; font-variant-numeric: tabular-nums; }
.tag.tc .t { color: var(--amber); }
.tag.tc .c { color: #9fe0a8; }
.tag.tc.low .t { color: #ff6a5a; }
.tag .sq { width: 5px; height: 5px; background: var(--amber); }

#feed { position: absolute; left: 50%; top: calc(max(6px, env(safe-area-inset-top, 0px)) + 28px); transform: translateX(-50%); display: grid; justify-items: center; gap: 3px; pointer-events: none; }
#feed span { padding: 4px 8px 3px; background: rgba(18, 20, 28, 0.74); color: var(--paper); font: 400 8px/1.1 var(--pixel); letter-spacing: 0; text-transform: uppercase; white-space: nowrap; animation: feed 2.2s steps(8) forwards; }
#feed span.good { color: #9fe0a8; }
#feed span.gold { color: var(--amber); }
#feed span.bad { color: #ff8a7a; }
@keyframes feed { 0%, 80% { opacity: 1; } 100% { opacity: 0; } }

.over { position: absolute; inset: 0; display: grid; place-items: center; padding: 12px max(16px, env(safe-area-inset-right, 0px)) 12px max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(180deg, rgba(18, 20, 28, 0) 25%, rgba(18, 20, 28, 0.6)); }
.card { width: min(460px, 100%); max-height: 100%; overflow: auto; padding: 16px 20px 16px; background: rgba(18, 20, 28, 0.88); border: 1px solid var(--line); box-shadow: 0 0 0 1px #000, 6px 6px 0 rgba(0, 0, 0, 0.35); display: grid; gap: 11px; cursor: default; }
.eyebrow { margin: 0; font: 400 8px/1 var(--pixel); letter-spacing: 0; text-transform: uppercase; color: var(--amber); }
.card h1, .card h2 { margin: 0; font: 700 32px/1 var(--pixel); letter-spacing: 0; color: var(--paper); text-wrap: balance; }
.card h2 { font-size: 24px; }
.card h1 span { color: var(--amber); }
.card p { margin: 0; font: 500 12px/1.5 var(--mono); color: var(--soft); }
.seg { display: flex; gap: 0; border: 1px solid var(--line); width: max-content; }
.seg button { padding: 6px 12px 5px; border: 0; background: transparent; color: var(--muted); font: 400 8px/1 var(--pixel); letter-spacing: 0; text-transform: uppercase; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--paper); color: var(--ink); }
.goals { margin: 0; padding: 0; list-style: none; display: grid; gap: 5px; font: 500 12px/1.4 var(--mono); color: var(--soft); }
.goals li { display: grid; grid-template-columns: 14px 1fr auto; gap: 8px; align-items: baseline; }
.goals li i { width: 8px; height: 8px; background: var(--amber); transform: translateY(1px); }
.goals li b { font: 400 8px/1 var(--pixel); color: var(--paper); letter-spacing: 0; font-variant-numeric: tabular-nums; }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font: 500 11px/1.4 var(--mono); color: var(--soft); padding-top: 9px; border-top: 1px solid var(--line); }
.keys b { font: 400 8px/1.4 var(--pixel); color: var(--amber); letter-spacing: 0; text-transform: uppercase; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.go { padding: 9px 16px 8px; border: 0; background: var(--amber); color: var(--ink); font: 700 16px/1 var(--pixel); letter-spacing: 0; text-transform: uppercase; cursor: pointer; box-shadow: 3px 3px 0 #000; }
.go:hover { background: #ffc867; }
.go.ghost { background: transparent; color: var(--paper); box-shadow: inset 0 0 0 1px var(--line); }
.go.ghost:hover { color: var(--amber); }
.go:disabled { opacity: 0.5; cursor: wait; }
.rec { font: 400 8px/1.2 var(--pixel) !important; letter-spacing: 0; text-transform: uppercase; color: var(--muted) !important; }
.go:focus-visible, .bar button:focus-visible, .tag.tl:focus-visible, .tb:focus-visible, .seg button:focus-visible { outline: 2px solid var(--paper); outline-offset: 2px; }

.score { margin: 0; display: grid; grid-template-columns: 1fr auto auto; gap: 4px 14px; font: 500 12px/1.4 var(--mono); color: var(--soft); font-variant-numeric: tabular-nums; }
.score dt { color: var(--soft); }
.score dd { margin: 0; text-align: right; }
.score dd.n { color: var(--muted); }
.score .neg { color: #ff8a7a; }
.total { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 9px; border-top: 1px solid var(--line); }
.total strong { font: 700 32px/1 var(--pixel); color: var(--paper); font-variant-numeric: tabular-nums; }
.mention { display: grid; place-items: center; width: 44px; height: 44px; background: var(--amber); color: var(--ink); font: 700 32px/1 var(--pixel); box-shadow: 3px 3px 0 #000; }

.bar { flex: none; display: flex; align-items: center; gap: 10px; min-height: 22px; padding: 3px max(8px, env(safe-area-inset-right, 0px)) calc(3px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); background: var(--ink); border-top: 1px solid var(--line); font: 500 9px/1 var(--mono); color: var(--muted); white-space: nowrap; overflow: hidden; }
.bar .logo { display: flex; align-items: center; gap: 6px; font: 700 8px/1 var(--pixel); color: var(--paper); letter-spacing: 0; text-transform: uppercase; }
.bar .logo svg { width: 14px; height: 10px; }
.hints { display: flex; gap: 0; min-width: 0; overflow: hidden; }
.hints span { padding: 0 7px; border-left: 1px solid var(--line); }
.hints b { color: var(--paper); font-weight: 700; margin-right: 4px; }
.bar .grow { flex: 1 1 auto; }
.bar button { display: flex; align-items: center; gap: 5px; padding: 2px 4px; border: 0; background: none; color: var(--paper); font: 400 8px/1 var(--pixel); letter-spacing: 0; text-transform: uppercase; cursor: pointer; }
.bar button:hover { color: var(--amber); }
.bar .cams { display: flex; align-items: center; gap: 2px; font: 400 8px/1 var(--pixel); color: var(--paper); font-variant-numeric: tabular-nums; }
.bar svg { flex: none; }

/* commandes tactiles */
.touch { position: absolute; inset: auto 0 0 0; display: none; justify-content: flex-end; gap: 10px; padding: 0 max(12px, env(safe-area-inset-right, 0px)) 12px max(12px, env(safe-area-inset-left, 0px)); pointer-events: none; }
.is-touch .touch { display: flex; }
.menu .touch { display: none !important; }
.tb { pointer-events: auto; width: 62px; height: 62px; border-radius: 50%; border: 2px solid rgba(233, 228, 238, 0.7); background: rgba(18, 20, 28, 0.55); color: var(--paper); font: 400 8px/1 var(--pixel); letter-spacing: 0; text-transform: uppercase; touch-action: none; }
.tb.on { background: var(--amber); color: var(--ink); }
#stick { position: absolute; width: 96px; height: 96px; margin: -48px 0 0 -48px; border-radius: 50%; border: 2px solid rgba(233, 228, 238, 0.55); pointer-events: none; display: none; }
#stick i { position: absolute; left: 50%; top: 50%; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: rgba(233, 228, 238, 0.75); }
.is-touch .hints, .is-touch #fsBtn { display: none; }
@media (max-width: 760px) { .hints { display: none; } .card h1 { font-size: 24px; } }
@media (max-height: 480px) { .card { gap: 8px; padding: 12px 16px; } .keys { display: none; } }
@media (prefers-reduced-motion: reduce) { #feed span { animation-timing-function: step-end; } }
/* accueil sur deux colonnes : la mission à gauche, « Comment marquer » à droite */
.card--wide { width: min(800px, 100%); grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); column-gap: 24px; align-items: start; }
.card--wide .col { display: grid; gap: 11px; align-content: start; min-width: 0; }
.card--wide .col + .col { padding-left: 24px; border-left: 1px solid var(--line); }
.goals li small { grid-column: 2 / -1; margin-top: -2px; font: 500 11px/1.45 var(--mono); color: var(--muted); }
.goals li + li { padding-top: 6px; border-top: 1px dashed var(--line); }
.goals li span { color: var(--paper); font-weight: 700; }
.tip { padding: 8px 10px; border-left: 3px solid var(--amber); background: rgba(242, 178, 76, 0.1); color: var(--paper) !important; }
.card--wide > .keys { grid-column: 1 / -1; grid-template-columns: auto 1fr auto 1fr; margin-top: 2px; }
.card .turbo { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: baseline; padding: 8px 10px; background: rgba(216, 50, 58, 0.16); border-left: 3px solid var(--holly); color: var(--soft); font: 500 11px/1.45 var(--mono); }
.turbo b { font: 400 8px/1.4 var(--pixel); letter-spacing: 0; text-transform: uppercase; color: var(--paper); background: var(--holly); padding: 1px 4px 0; }
.turbo strong { color: var(--paper); }
@media (max-width: 700px) {
  .card--wide { grid-template-columns: minmax(0, 1fr); }
  .card--wide .col + .col { padding-left: 0; border-left: 0; padding-top: 11px; border-top: 1px solid var(--line); }
  .card--wide > .keys { grid-template-columns: auto 1fr; }
}
</style>
</head>
<body>
<div id="app" class="menu">
  <div id="stage">
    <canvas id="gl"></canvas>
    <canvas id="hud"></canvas>
    <button class="tag tl" id="camTag" type="button" title="Changer de caméra (Espace)"><span class="sq"></span><span id="camLabel">02 / Poursuite</span></button>
    <div class="tag tc" id="mTag" hidden><span class="t" id="mTime">3:00</span><span id="mScore">0</span><span class="c" id="mCombo"></span></div>
    <div class="tag tr" id="hdgTag">000°&nbsp;&nbsp;000 KT</div>
    <div id="feed" aria-live="polite"></div>
    <div id="stick"><i></i></div>
    <div class="touch" id="touch">
      <button class="tb" id="tRoll" type="button">Tonneau</button>
      <button class="tb" id="tMsl" type="button">Missile</button>
      <button class="tb" id="tBoost" type="button">Boost</button>
    </div>
    <div class="over" id="intro">
      <div class="card card--wide">
        <div class="col">
          <p class="eyebrow" id="eyebrow">Édition de Noël</p>
          <h1>Vol du <span>soir</span></h1>
          <p id="pitch"></p>
          <div class="actions">
            <button class="go" id="goMission" type="button">Mission · 3 min</button>
            <button class="go ghost" id="goFree" type="button">Vol libre</button>
          </div>
          <p class="rec" id="rec"></p>
        </div>
        <div class="col">
          <p class="eyebrow">Comment marquer</p>
          <ul class="goals" id="goals"></ul>
          <p class="turbo" id="turbo"></p>
          <p class="tip" id="tip"></p>
        </div>
        <div class="keys" id="keys"></div>
      </div>
    </div>
    <div class="over" id="results" hidden>
      <div class="card">
        <p class="eyebrow" id="resEyebrow">Mission terminée</p>
        <h2 id="resTitle">Fin de patrouille</h2>
        <dl class="score" id="resRows"></dl>
        <div class="total"><div><p class="rec">Total</p><strong id="resTotal">0</strong></div><div class="mention" id="resMention">B</div></div>
        <p class="rec" id="resRec"></p>
        <div class="actions">
          <button class="go" id="again" type="button">Rejouer</button>
          <button class="go ghost" id="toFree" type="button">Vol libre</button>
          <button class="go ghost" id="toMenu" type="button">Menu</button>
        </div>
      </div>
    </div>
  </div>
  <div class="bar">
    <span class="logo"><svg viewBox="0 0 14 10" aria-hidden="true"><path fill="#f2b24c" d="M7 0 8 3 14 6 14 7 8 6 8 8 10 9 10 10 7 9 4 10 4 9 6 8 6 6 0 7 0 6 6 3z"/></svg>Vol du soir</span>
    <span class="hints" id="hints"><span><b>Souris</b>Diriger</span><span><b>Clic</b>Tonneau</span><span><b>Maintenu · Maj</b>Turbo</span><span><b>Espace</b>Caméra</span><span><b>F / clic droit</b><em id="hintFire" style="font-style:normal">Cadeau</em></span></span>
    <span class="grow"></span>
    <span class="cams"><button type="button" id="camPrev" aria-label="Caméra précédente">&larr;</button><span id="camIdx">2/4</span><button type="button" id="camNext" aria-label="Caméra suivante">&rarr;</button></span>
    <button type="button" id="sndBtn"><svg width="9" height="8" viewBox="0 0 9 8" aria-hidden="true"><path fill="currentColor" d="M0 2h2l3-2v8L2 6H0z"/></svg><span id="sndLabel">Son coupé</span></button>
    <button type="button" id="fsBtn"><svg width="8" height="8" viewBox="0 0 8 8" aria-hidden="true"><path fill="none" stroke="currentColor" d="M.5 3V.5H3M5 .5h2.5V3M7.5 5v2.5H5M3 7.5H.5V5"/></svg><span id="fsLabel">Plein écran</span></button>
  </div>
</div>

<script src="lib/three.min.js"></script>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const stage = $('stage');
  if (!window.THREE) {
    $('pitch').textContent = 'La bibliothèque 3D n’a pas pu se charger. Recharge la page.';
    return;
  }
  const isTouch = matchMedia('(pointer: coarse)').matches;
  if (isTouch) document.documentElement.classList.add('is-touch');

  // ================================================================ monde
  // Un carré de 10 km qui se répète à l'infini (bruit périodique) : rivière, deux lacs, collines, montagnes.
  const TILE = 10000;
  const N = 200;               // grille de hauteurs
  const CELL = TILE / N;       // 50 m
  const TEX = 1024;            // texture de couleurs (~10 m par texel)
  const JET = 2.6;             // échelle du jet (plus gros que nature, comme dans un jeu)
  const FOG_NEAR = 900, FOG_FAR = 7200;
  const MISSION_TIME = 180;
  // graine du jour (date de Paris) : même parcours pour tout le monde le même jour
  const DAY = (() => { try { const s = new Intl.DateTimeFormat('fr-CA', { timeZone: 'Europe/Paris' }).format(new Date()); return Math.floor(Date.parse(s) / 864e5); } catch { return Math.floor(Date.now() / 864e5); } })();

  const smooth = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  function hash2(x, y, s) {
    let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263) + Math.imul(s, 1442695041)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  }
  const rh = (k, s) => hash2(k, s, DAY);
  // bruit de valeur périodique (période 1 en u et v)
  function vnoise(u, v, L, s) {
    const x = u * L, y = v * L;
    const xf = Math.floor(x), yf = Math.floor(y);
    const fx = x - xf, fy = y - yf;
    const sx = fx * fx * (3 - 2 * fx), sy = fy * fy * (3 - 2 * fy);
    const x0 = ((xf % L) + L) % L, y0 = ((yf % L) + L) % L;
    const x1 = (x0 + 1) % L, y1 = (y0 + 1) % L;
    const a = hash2(x0, y0, s), b = hash2(x1, y0, s), c = hash2(x0, y1, s), d = hash2(x1, y1, s);
    return a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
  }
  function fbm(u, v, L, oct, s) {
    let sum = 0, amp = 0.5, norm = 0;
    for (let k = 0; k < oct; k++) { sum += amp * vnoise(u, v, L << k, s + k * 13); norm += amp; amp *= 0.5; }
    return sum / norm;
  }
  const TAU = Math.PI * 2;
  function riverU(v) { const t = TAU * v; return 0.5 + 0.11 * Math.sin(t) + 0.045 * Math.sin(2 * t + 1.3) + 0.02 * Math.sin(3 * t + 0.4); }
  function riverSlope(v) { const t = TAU * v; return TAU * (0.11 * Math.cos(t) + 0.09 * Math.cos(2 * t + 1.3) + 0.06 * Math.cos(3 * t + 0.4)); }
  function bump(v, c, w) { let d = v - c; d -= Math.round(d); const x = d / w; return Math.exp(-x * x * 2.2); }
  function halfWidth(v) { return 120 + 560 * bump(v, 0.12, 0.075) + 340 * bump(v, 0.62, 0.05) + 35 * Math.sin(TAU * v * 5); }
  function riverDist(u, v) { let du = u - riverU(v); du -= Math.round(du); const s = riverSlope(v); return Math.abs(du) * TILE / Math.sqrt(1 + s * s); }
  function heightUV(u, v) {
    const d = riverDist(u, v), hw = halfWidth(v);
    const hills = fbm(u, v, 5, 5, 3);
    let h = 25 + Math.pow(hills, 1.6) * 560;
    const n = fbm(u, v, 3, 5, 17);
    const r = 1 - Math.abs(2 * n - 1);
    const mask = smooth(600, 2400, d - hw) * (0.5 + 0.5 * fbm(u, v, 2, 2, 29));
    h += mask * r * r * 2000;
    const w = 360 + 300 * fbm(u, v, 8, 2, 41);
    const t = smooth(hw * 0.75, hw + w, d);
    const bed = -6 - 22 * (1 - Math.min(1, d / hw));
    return bed + (h - bed) * t;
  }
  const HM = new Float32Array(N * N);
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) HM[j * N + i] = heightUV(i / N, j / N);
  const hg = (i, j) => HM[(((j % N) + N) % N) * N + (((i % N) + N) % N)];
  function heightAt(x, z) {
    const gx = (x / TILE + 0.5) * N, gz = (z / TILE + 0.5) * N;
    const i = Math.floor(gx), j = Math.floor(gz), fx = gx - i, fz = gz - j;
    const a = hg(i, j), b = hg(i + 1, j), c = hg(i, j + 1), d = hg(i + 1, j + 1);
    return a + (b - a) * fx + (c - a) * fz + (a - b - c + d) * fx * fz;
  }
  const groundAt = (x, z) => Math.max(0, heightAt(x, z));
  const SLOPE = new Float32Array(N * N);
  const depthData = new Uint8Array(N * N * 4);
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
    const gx = (hg(i + 1, j) - hg(i - 1, j)) / (2 * CELL), gz = (hg(i, j + 1) - hg(i, j - 1)) / (2 * CELL);
    SLOPE[j * N + i] = Math.hypot(gx, gz);
    const k = (j * N + i) * 4;
    depthData[k] = Math.round(Math.max(0, Math.min(51, -HM[j * N + i])) * 5); depthData[k + 3] = 255;
  }
  const sg = (i, j) => SLOPE[(((j % N) + N) % N) * N + (((i % N) + N) % N)];
  // la copie d'un point du carré de base la plus proche d'un autre point (le monde se répète)
  const near = (a, ref) => a + TILE * Math.round((ref - a) / TILE);

  // ================================================================ thèmes
  const hex = (h) => [(h >> 16) & 255, (h >> 8) & 255, h & 255];
  const v3 = (h) => new THREE.Vector3(((h >> 16) & 255) / 255, ((h >> 8) & 255) / 255, (h & 255) / 255);
  const THEMES = {
    noel: {
      id: 'noel', eyebrow: 'Édition de Noël · jeu du jour',
      pitch: 'Le traîneau est au garage : cette année, les cadeaux partent en jet. Une tournée de 3 minutes au-dessus du lac gelé, entre les sapins et les chalets.',
      goals: [
        ['Couronnes', '50 → 100', 'Une toutes les 3 s le long de la rivière, +10 par couronne d’affilée (jusqu’à 100). En rater une, ou quitter la rivière, remet la série à zéro.'],
        ['Cadeaux', '180 · 300 pile', 'Sur les chalets au faisceau doré, quand le losange au sol touche la maison. Un « pile » vaut 3 couronnes, mais un détour de 10 à 15 s en fait manquer 3 à 5 et casse la série.'],
        ['Rase-mottes', '6 / s', 'Sous 60 m au-dessus de la neige ou de la glace.'],
        ['Crash', '−250', 'Et la série repart de zéro.']
      ],
      tip: 'Le bon plan : enchaîne les couronnes au turbo et ne livre que les chalets qui sont sur ta route, près de la rivière.',
      fire: 'Cadeau', fireKey: 'cadeau (le losange montre où il tombera)', ammoName: 'CAD', ammoMax: 5, reloadT: 2.4,

    if (r) r.visible = false;
    const start = new THREE.Vector3();
    (r || jet).getWorldPosition(start);
    const g = new THREE.Group();
    g.add(new THREE.Mesh(mslGeo, M.white), new THREE.Mesh(mslNose, M.red));
    g.add(new THREE.Mesh(new THREE.ConeGeometry(0.5, 4, 6).rotateX(Math.PI / 2).translate(0, 0, 5.5), M.flame));
    g.position.copy(start); g.quaternion.copy(jet.quaternion);
    scene.add(g);
    const tgt = lockTarget;
    missiles.push({ g, vel: fwd.clone().multiplyScalar(speed).add(new THREE.Vector3(0, -12, 0)), dir: fwd.clone(), t: 0, smoke: 0, tgt, far: tgt ? tgt.position.distanceTo(pos) > 900 : false });
    sfx('launch', 0.8);
  }
  function syncRails() { let n = ammo; for (const r of rails) { r.visible = TH.target !== 'gifts' && n > 0; n--; } }

  // cadeaux : un colis lâché sous le jet, parachute ouvert au bout d'une demi-seconde
  function giftPhys(p, v, t, dt) {
    if (t < 0.5) { v.y -= 9.81 * dt; v.multiplyScalar(1 - dt * 0.05); }
    else { const k = Math.exp(-1.6 * dt); v.x *= k; v.z *= k; v.y += (-26 - v.y) * Math.min(1, dt * 3); }
    p.addScaledVector(v, dt);
  }
  const predP = new THREE.Vector3(), predV = new THREE.Vector3();
  function predictGift() {
    predP.copy(pos).y -= 6; predV.copy(fwd).multiplyScalar(speed);
    for (let i = 0, t = 0; i < 500; i++, t += 0.05) { giftPhys(predP, predV, t, 0.05); if (predP.y <= groundAt(predP.x, predP.z)) break; }
    predP.y = groundAt(predP.x, predP.z);
    return predP;
  }
  function dropGift() {
    if (ammo <= 0) { feed('Soute vide : recharge en cours', 'bad'); return; }
    if (fireCd > 0) return;
    fireCd = 0.45; ammo--; reload = 0;
    const g = new THREE.Group();
    const mat = giftMats[Math.floor(Math.random() * giftMats.length)];
    g.add(new THREE.Mesh(giftBox, mat), new THREE.Mesh(ribbonA, goldMat), new THREE.Mesh(ribbonB, goldMat));
    const chute = new THREE.Mesh(chuteGeo, chuteMat); chute.position.y = 13; chute.visible = false; g.add(chute);
    g.position.copy(pos).y -= 6;
    scene.add(g);
    gifts.push({ g, chute, v: fwd.clone().multiplyScalar(speed), t: 0, landed: 0 });
    sfx('roll', 0.4);
  }
  // distance horizontale au chalet signalé le plus proche (le monde se répète)
  function nearestBeacon(p) {
    let best = null, bd = 1e9;
    for (const b of beacons) {
      if (!b.visible || b.userData.house < 0) continue;
      const h = houses[b.userData.house];
      const d = Math.hypot(near(h.x, p.x) - p.x, near(h.z, p.z) - p.z);
      if (d < bd) { bd = d; best = b; }
    }
    return { b: best, d: bd };
  }
  function pickBeacon(b) {
    // un chalet devant, entre 1,5 et 4,5 km, qui n'est pas déjà signalé
    const taken = new Set(beacons.filter((o) => o !== b && o.visible).map((o) => o.userData.house));
    let best = -1, bs = -1e9;
    houses.forEach((h, i) => {
      if (taken.has(i)) return;
      const x = near(h.x, pos.x), z = near(h.z, pos.z), dx = x - pos.x, dz = z - pos.z, d = Math.hypot(dx, dz);
      const ahead = (dx * Math.sin(heading) - dz * Math.cos(heading)) / (d || 1);
      const s = -Math.abs(d - 2600) / 1000 + ahead * 1.5 + hash2(i, course.k, DAY) * 0.6;
      if (d > 900 && s > bs) { bs = s; best = i; }
    });
    b.userData.house = best;
    b.visible = best >= 0;
  }

  function riverPoint(v) {
    const u = riverU(v);
    const p = new THREE.Vector3((u - 0.5) * TILE, 0, (v - 0.5) * TILE);
    const dx = riverSlope(v) * TILE, dz = TILE;
    return { p, heading: Math.atan2(dx, -dz) };
  }
  function spawn(v, alt) {
    const r = riverPoint(v);
    pos.set(r.p.x, alt, r.p.z); heading = r.heading; pitch = 0; bank = 0; speed = 215; rolling = 0;
    fwd.set(Math.sin(heading), 0, -Math.cos(heading));
    crashed = 0; jet.visible = true; shadow.visible = true;
    for (const t of trails) { t.n = 0; t.line.geometry.setDrawRange(0, 0); }
    camState.init = false;
  }
  function wrapWorld() {
    let dx = 0, dz = 0;
    if (pos.x > TILE / 2) dx = -TILE; else if (pos.x < -TILE / 2) dx = TILE;
    if (pos.z > TILE / 2) dz = -TILE; else if (pos.z < -TILE / 2) dz = TILE;
    if (!dx && !dz) return;
    const d = new THREE.Vector3(dx, 0, dz);
    pos.add(d); camState.pos.add(d); camState.fly.add(d);
    for (const t of trails) { for (let i = 0; i < t.n; i++) { t.pos[i * 3] += dx; t.pos[i * 3 + 2] += dz; } t.line.geometry.attributes.position.needsUpdate = true; }
    for (const m of missiles) m.g.position.add(d);
    for (const g of gifts) g.g.position.add(d);
    for (const s of puffs) if (s.visible) s.position.add(d);
    for (const b of booms) if (b.visible) b.position.add(d);
    for (const r of rings) r.position.add(d);
    for (const b of balloons) { b.userData.base.add(d); b.position.add(d); }
  }

  const angDiff = (a, b) => { let d = a - b; while (d > Math.PI) d -= TAU; while (d < -Math.PI) d += TAU; return d; };
  function autopilot() {
    // pilote automatique de l'écran d'accueil : suivre la rivière à 230 m
    const t = riverPoint(pos.z / TILE + 0.5 + 0.05).p;
    t.z = pos.z + 0.05 * TILE;
    const want = Math.atan2(t.x - pos.x, -(t.z - pos.z));
    const dh = angDiff(want, heading);
    return { x: clamp(dh * 1.6, -0.7, 0.7), y: clamp((pos.y - 230) / 160 + pitch * 1.6, -0.8, 0.8) };
  }

  function updateFlight(dt) {
    let sx = input.x, sy = input.y;
    const k = input.keys;
    const kx = (k.has('ArrowRight') || k.has('KeyD') ? 1 : 0) - (k.has('ArrowLeft') || k.has('KeyA') ? 1 : 0);
    const ky = (k.has('ArrowDown') || k.has('KeyS') ? 1 : 0) - (k.has('ArrowUp') || k.has('KeyW') ? 1 : 0);
    if (kx || ky) { sx = kx * 0.85; sy = ky * 0.85; }
    if (!started) { const a = autopilot(); sx = a.x; sy = a.y; }
    const dz = (v) => (Math.abs(v) < 0.05 ? 0 : (v - Math.sign(v) * 0.05) / 0.95);
    sx = dz(sx); sy = dz(sy);
    const boosting = started && (input.boost || k.has('ShiftLeft') || k.has('ShiftRight'));
    boostAmt += ((boosting ? 1 : 0) - boostAmt) * Math.min(1, dt * 3);
    const targetBank = sx * 1.25;
    if (rolling > 0) {
      rolling = Math.min(1, rolling + dt / 0.85);
      const e = rolling < 0.5 ? 2 * rolling * rolling : 1 - Math.pow(-2 * rolling + 2, 2) / 2;
      bank = rollFrom + rollDir * TAU * e;
      if (rolling >= 1) { rolling = 0; bank = angDiff(bank, 0); }
    } else bank += (targetBank - bank) * Math.min(1, dt * 4);
    const turnBank = rolling > 0 ? targetBank : bank;
    const turn = Math.sin(turnBank) * 0.9;
    heading += turn * dt;
    const pr = -sy * 1.05;
    pitch += pr * dt;
    if (pos.y > 3600) pitch -= dt * 0.6;
    pitch = clamp(pitch, -1.25, 1.25);
    const target = 215 + boostAmt * 120;
    speed += (target - speed) * dt * 0.7 - 9.81 * Math.sin(pitch) * dt * 1.4;
    speed = clamp(speed, 120, 430);
    fwd.set(Math.sin(heading) * Math.cos(pitch), Math.sin(pitch), -Math.cos(heading) * Math.cos(pitch));
    pos.addScaledVector(fwd, speed * dt);
    lastG = Math.sqrt(1 + Math.pow(speed * turn / 9.81, 2) * 0.02) + pr * speed / 400;
    jet.position.copy(pos);
    jet.rotation.set(pitch, -heading, -bank);
    const gnd = heightAt(pos.x, pos.z);
    if (pos.y < Math.max(gnd, 0) + 3 * JET) crash(gnd < 0);
  }
  function crash(onWater) {
    crashed = 2.6;
    jet.visible = false; shadow.visible = false;
    explode(pos.clone(), 70, onWater);
    explode(pos.clone().add(new THREE.Vector3(0, 30, 0)), 45, false);
    const msg = onWater ? (TH.ice ? 'Glissade sur la glace !' : 'Plouf !') : 'Crash !';
    if (mission.on) { mission.crashes++; mission.streak = 0; feed(msg + ' −250', 'bad'); }
    else feed(msg + ' Retour en vol…', 'bad');
  }
  function startRoll(dir) {
    if (rolling > 0 || crashed) return;
    rolling = 0.0001; rollDir = dir; rollFrom = bank;
    sfx('roll', 0.5);
  }

  // ---------------------------------------------------------------- parcours d'anneaux le long de la rivière
  function placeRing(ring, prevPos) {
    const v = course.v, k = course.k++;
    const s = riverSlope(v);
    const t = new THREE.Vector3(s, 0, 1).normalize().multiplyScalar(course.sgn);
    const n = new THREE.Vector3(-t.z, 0, t.x);
    const c = riverPoint(v).p;
    const off = clamp((rh(k, 1) - 0.5) * 0.85 * halfWidth(v), -160, 160) * (course.k <= 2 ? 0.2 : 1);
    const alts = [45, 95, 60, 150, 38, 120, 75, 200];
    const p = c.addScaledVector(n, off);
    p.y = Math.max(k === 0 ? 160 : k === 1 ? 130 : alts[k % alts.length] + rh(k, 2) * 30, groundAt(p.x, p.z) + RING_R + 25);
    const ref = prevPos || pos;
    p.x = near(p.x, ref.x); p.z = near(p.z, ref.z);
    ring.position.copy(p);
    ring.userData.dir.copy(t);
    ring.userData.k = k;
    ring.lookAt(p.clone().add(t));
    ring.visible = true;
    // un ballon-cible de temps en temps, sur le côté du parcours
    if (TH.target === 'balloons' && k % 2 === 1) spawnBalloon(p, n, k);
    // prochain anneau : ~620 m plus loin le long de la rivière
    course.v += course.sgn * 620 / (TILE * Math.sqrt(1 + s * s));
    return p;
  }
  function resetCourse() {
    course.sgn = fwd.z >= 0 ? 1 : -1;
    course.v = pos.z / TILE + 0.5 + course.sgn * 0.07;
    let prev = null;
    for (let i = 0; i < rings.length; i++) prev = placeRing(rings[i], prev);
    course.active = 0; course.far = 0;
    rings[0].userData.prev = signedDist(rings[0]);
    styleRings();
  }
  const signedDist = (r) => tmpA.copy(pos).sub(r.position).dot(r.userData.dir);
  const tmpA = new THREE.Vector3();
  function styleRings() {
    rings.forEach((r, i) => {
      const order = (i - course.active + rings.length) % rings.length;
      const u = r.userData;
      u.thin.visible = TH.id === 'dusk'; u.wreath.visible = TH.id === 'noel';
      u.thin.material = order === 0 ? ringMat.dusk : ringMat.duskNext;
      r.scale.setScalar(order === 0 ? 1 : 0.86);
      u.order = order;
    });
  }
  function updateRings(dt) {
    const r = rings[course.active];
    const s = signedDist(r);
    const prev = r.userData.prev;
    r.userData.prev = s;
    if (prev < 0 && s >= 0) {
      const lat = tmpA.copy(pos).sub(r.position).addScaledVector(r.userData.dir, -s).length();
      if (lat < RING_R - 2) {
        mission.streak++;
        mission.best = Math.max(mission.best, mission.streak);
        const pts = Math.min(100, 50 + 10 * (mission.streak - 1));
        mission.rings++; mission.ringPts += pts; mission.score += pts;
        feed((TH.id === 'noel' ? 'Couronne' : 'Anneau') + ' +' + pts + (mission.streak > 1 ? '  série ×' + mission.streak : ''), 'gold');
        sfx('ring', 0.7);
        if (TH.id === 'noel') confetti(r.position, [0xd8323a, 0xffd060, 0x5bbf6a, 0xffffff], 18);
      } else { mission.missed++; mission.streak = 0; feed('Raté !', 'bad'); }
      advanceRing();
      return;
    }
    const d = r.position.distanceTo(pos);
    if (d > 2600) {
      course.far += dt;
      if (course.far > 4) {
        resetCourse();
        if (mission.on && mission.streak > 0) { mission.streak = 0; feed('Rivière quittée : série à zéro', 'bad'); } else feed('Nouveau parcours devant toi');
      }
    } else course.far = 0;
  }
  function advanceRing() {
    const r = rings[course.active];
    const last = rings[(course.active + rings.length - 1) % rings.length];
    placeRing(r, last.position);
    course.active = (course.active + 1) % rings.length;
    rings[course.active].userData.prev = signedDist(rings[course.active]);
    styleRings();
  }

  // ---------------------------------------------------------------- ballons-cibles
  function spawnBalloon(p, n, k) {
    const b = balloons.find((o) => !o.userData.alive);
    if (!b) return;
    const side = rh(k, 3) < 0.5 ? -1 : 1;
    const q = p.clone().addScaledVector(n, side * (180 + rh(k, 4) * 320));
    q.y = Math.max(groundAt(q.x, q.z) + 70, 110 + rh(k, 5) * 260);
    b.userData.base.copy(q); b.position.copy(q);
    b.userData.alive = true; b.visible = true;
  }
  function popBalloon(b, far) {
    b.userData.alive = false; b.visible = false;
    confetti(b.position, [b.userData.col, 0xffffff, 0xffd060], 26);
    puff(b.position, 10, 40, 0.5, 0xffffff, 0xf2d4bc);
    const pts = far ? 150 : 120;
    if (mission.on) { mission.hits++; mission.hitPts += pts; mission.score += pts; feed('Ballon +' + pts + (far ? ' de loin' : ''), 'good'); }
    else feed('Ballon !', 'good');
    sfx('pop', 0.8);
  }

  // ================================================================ caméras
  const CAMS = [{ id: '01', name: 'Dessus', fov: 52 }, { id: '02', name: 'Poursuite', fov: 62 }, { id: '03', name: 'Cockpit', fov: 74 }, { id: '04', name: 'Passage', fov: 38 }];
  let camMode = 1;
  const camState = { pos: new THREE.Vector3(), fly: new THREE.Vector3(), init: false };
  function setCam(i) {
    camMode = (i + CAMS.length) % CAMS.length;
    $('camLabel').textContent = CAMS[camMode].id + ' / ' + CAMS[camMode].name;
    $('camIdx').textContent = (camMode + 1) + '/4';
    camState.init = false;
    placeFlyby();
  }
  function placeFlyby() {
    const right = new THREE.Vector3(Math.cos(heading), 0, Math.sin(heading));
    const p = pos.clone().addScaledVector(fwd, 1100).addScaledVector(right, (Math.random() < 0.5 ? -1 : 1) * 160);
    p.y = Math.max(groundAt(p.x, p.z) + 25, pos.y - 40 + Math.random() * 60);
    camState.fly.copy(p);
  }
  const tmpV = new THREE.Vector3();
  function updateCamera(dt) {
    const c = CAMS[camMode];
    const nearPlane = camMode === 2 ? 0.5 : 2;
    if (camera.fov !== c.fov || camera.near !== nearPlane) { camera.fov = c.fov; camera.near = nearPlane; camera.updateProjectionMatrix(); }
    jet.visible = !crashed && camMode !== 2;
    if (camMode === 0) {
      camera.position.set(pos.x, pos.y + 300, pos.z + 0.01);
      camera.rotation.set(-Math.PI / 2, 0, 0);
    } else if (camMode === 1) {
      const back = new THREE.Vector3(Math.sin(heading) * Math.cos(pitch * 0.7), Math.sin(pitch * 0.7), -Math.cos(heading) * Math.cos(pitch * 0.7));
      const want = pos.clone().addScaledVector(back, crashed ? -170 : -47).add(tmpV.set(0, crashed ? 70 : 12, 0));
      const g = groundAt(want.x, want.z) + 12;
      if (want.y < g) want.y = g;
      if (!camState.init) { camState.pos.copy(want); camState.init = true; }
      camState.pos.lerp(want, 1 - Math.exp(-dt * (crashed ? 2 : 7)));
      camera.position.copy(camState.pos);
      camera.up.set(0, 1, 0);
      camera.lookAt(tmpV.copy(pos).addScaledVector(fwd, 50).add(new THREE.Vector3(0, 4, 0)));
      camera.rotateZ(-angDiff(bank, 0) * 0.22);
    } else if (camMode === 2) {
      tmpV.set(0, 1.25, -4.4).multiplyScalar(JET).applyQuaternion(jet.quaternion);
      camera.position.copy(pos).add(tmpV);
      camera.quaternion.copy(jet.quaternion);
    } else {
      if (!camState.init) { placeFlyby(); camState.init = true; }
      const away = tmpV.copy(pos).sub(camState.fly);
      if (away.length() > 1700 || away.dot(fwd) > 650) placeFlyby();
      camera.position.copy(camState.fly);
      camera.up.set(0, 1, 0);
      camera.lookAt(pos);
    }
  }

  // ================================================================ rendu pixel : basse résolution + palette + tramage
  const palArr = new Float32Array(PAL_N * 3);
  let W = 640, H = 360;
  const rt = new THREE.WebGLRenderTarget(W, H, { minFilter: THREE.NearestFilter, magFilter: THREE.NearestFilter, depthBuffer: true });
  const postScene = new THREE.Scene();
  const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const postMat = new THREE.ShaderMaterial({
    uniforms: { src: { value: rt.texture }, pal: { value: palArr } },
    vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }`,
    fragmentShader: `
      uniform sampler2D src; uniform vec3 pal[${PAL_N}]; varying vec2 vUv;
      float b2(vec2 a){ a = floor(a); return fract(dot(a, vec2(0.5, a.y * 0.75))); }
      float bayer(vec2 a){ return b2(0.5 * a) * 0.25 + b2(a); }
      void main(){
        vec3 c = texture2D(src, vUv).rgb;
        c += (bayer(gl_FragCoord.xy) - 0.5) * 0.075;
        float best = 1e9; vec3 bc = c;
        for (int i = 0; i < ${PAL_N}; i++) {
          vec3 d = c - pal[i];
          float dd = dot(d * d, vec3(0.30, 0.52, 0.18));
          if (dd < best) { best = dd; bc = pal[i]; }
        }
        gl_FragColor = vec4(bc, 1.0);
      }`
  });
  postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), postMat));

  const hud = hudCanvas.getContext('2d');
  let px = 2;
  function resize() {
    const sw = stage.clientWidth || 1, sh = stage.clientHeight || 1;
    px = clamp(Math.round(sw / 600), 1, 4);
    W = Math.ceil(sw / px); H = Math.ceil(sh / px);
    renderer.setSize(W, H, false);
    rt.setSize(W, H);
    hudCanvas.width = W; hudCanvas.height = H;
    camera.aspect = W / H; camera.updateProjectionMatrix();
  }
  new ResizeObserver(resize).observe(stage);
  resize();

  // ================================================================ police pixel 3×5 et petits outils de dessin pour l'ATH
  const FONT = {
    '0': '111101101101111', '1': '010110010010111', '2': '111001111100111', '3': '111001111001111', '4': '101101111001001',
    '5': '111100111001111', '6': '111100111101111', '7': '111001001010010', '8': '111101111101111', '9': '111101111001111',
    'A': '010101111101101', 'B': '110101110101110', 'C': '011100100100011', 'D': '110101101101110', 'E': '111100110100111',
    'F': '111100110100100', 'G': '011100101101011', 'H': '101101111101101', 'I': '111010010010111', 'K': '101101110101101',
    'L': '100100100100111', 'M': '101111111101101', 'N': '110101101101101', 'O': '010101101101010', 'P': '110101110100100',
    'R': '110101110101101', 'S': '011100010001110', 'T': '111010010010010', 'U': '101101101101111', 'V': '101101101101010',
    'W': '101101111111101', 'X': '101101010101101', 'Y': '101101010010010', 'Z': '111001010100111',
    '-': '000000111000000', '.': '000000000000010', '/': '001001010100100', ':': '000010000010000', '+': '000010111010000',
    '°': '010101010000000', ' ': '000000000000000', '>': '100010001010100', '<': '001010100010001', '×': '000101010101000'
  };
  function text(s, x, y, col, align) {
    s = String(s).toUpperCase();
    const w = s.length * 4 - 1;
    let cx = Math.round(align === 'c' ? x - w / 2 : align === 'r' ? x - w : x);
    y = Math.round(y);
    hud.fillStyle = col;
    for (const ch of s) {
      const g = FONT[ch] || FONT[' '];
      for (let r = 0; r < 5; r++) for (let c = 0; c < 3; c++) if (g[r * 3 + c] === '1') hud.fillRect(cx + c, y + r, 1, 1);
      cx += 4;
    }
  }
  function line(x0, y0, x1, y1, col) { // Bresenham : traits nets, pixel par pixel
    x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);
    hud.fillStyle = col;
    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
    let e = dx + dy, n = 0;
    for (;;) { hud.fillRect(x0, y0, 1, 1); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } if (++n > 4000) break; }
  }
  function ring(cx, cy, r, col, from, to) {
    from = from ?? 0; to = to ?? TAU;
    const n = Math.max(12, Math.round(r * 6));
    let px0 = null, py0 = null;
    for (let i = 0; i <= n; i++) { const a = from + (to - from) * i / n; const x = cx + Math.cos(a) * r, y = cy + Math.sin(a) * r; if (px0 !== null) line(px0, py0, x, y, col); px0 = x; py0 = y; }
  }
  function disc(cx, cy, r, col) { hud.fillStyle = col; hud.beginPath(); hud.arc(Math.round(cx) + 0.5, Math.round(cy) + 0.5, r, 0, TAU); hud.fill(); }
  const prj = new THREE.Vector3();
  function toScreen(p) {
    prj.copy(p).project(camera);

  function render() {
    updateCamera(0);
    if (!crashed) {
      let g = groundAt(pos.x, pos.z);
      for (let k = 0; k < 2; k++) { const d = (pos.y - g) / SUN.y; g = groundAt(pos.x - SUN.x * d, pos.z - SUN.z * d); }
      g += 0.8;
      const L = SUN;
      shadowM.set(L.y, -L.x, 0, L.x * g, 0, 0, 0, g * L.y, 0, -L.z, L.y, L.z * g, 0, 0, 0, L.y);
      jet.updateMatrixWorld();
      shadow.matrix.multiplyMatrices(shadowM, jet.matrixWorld);
      shadow.visible = pos.y - g < 900;
    }
    camera.updateMatrixWorld();
    projM.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
    frustum.setFromProjectionMatrix(projM);
    tiles.forEach((t, i) => {
      const b = t.userData.box;
      const dx = Math.max(b.min.x - camera.position.x, 0, camera.position.x - b.max.x);
      const dz = Math.max(b.min.z - camera.position.z, 0, camera.position.z - b.max.z);
      const d = Math.hypot(dx, dz);
      t.visible = d < FOG_FAR + 300 && frustum.intersectsBox(b);
      villageTiles[i].visible = TH.id === 'noel' && t.visible && d < 5200;
    });
    for (const c of clouds) {
      const b = c.userData.base;
      c.position.set(near(b.x, camera.position.x), b.y, near(b.z, camera.position.z));
      const d = c.position.distanceTo(camera.position);
      c.material.opacity = 1 - smooth(4200, 5200, d);
      c.visible = c.material.opacity > 0.02;
    }
    water.position.set(Math.round(camera.position.x / 100) * 100, 0, Math.round(camera.position.z / 100) * 100);
    sky.position.copy(camera.position);
    terrainMat.uniforms.camPos.value.copy(camera.position);
    waterMat.uniforms.camPos.value.copy(camera.position);
    waterMat.uniforms.time.value = time;
    skyMat.uniforms.time.value = time;
    snowMat.uniforms.camPos.value.copy(camera.position);
    snowMat.uniforms.time.value = time;
    renderer.setRenderTarget(rt);
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    renderer.render(postScene, postCam);
    hud.clearRect(0, 0, W, H);
    if (camMode === 2 && !crashed) drawCockpit(time);
    if (started || mission.on) drawObjectives();
    if (camMode === 2 && !crashed) drawCockpitFrame(time);

    $('hdgTag').textContent = String(hd).padStart(3, '0') + '°  ' + Math.round(speed * 1.944) + ' KT';
    if (mission.on) {
      const s = Math.max(0, Math.ceil(mission.t));
      $('mTime').textContent = Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');

      $('mScore').textContent = missionTotal().toLocaleString('fr-FR') + ' pts';
      $('mCombo').textContent = mission.streak > 1 ? 'série ×' + mission.streak : '';
    }
  }

  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    if (!paused) {
      // pas fixe de 1/120 s : le vol ne dépend pas de la fréquence de l'écran
      acc += dt;
      while (acc >= STEP) { step(STEP); updateCamera(STEP); acc -= STEP; }
    }
    render();
    requestAnimationFrame(frame);
  }

  // ================================================================ son (coupé par défaut)
  let actx = null, soundOn = false, eng = null;
  function initAudio() {
    if (actx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    const len = actx.sampleRate * 2, buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
    let b = 0;
    for (let i = 0; i < len; i++) { b = (b + 0.02 * (Math.random() * 2 - 1)) / 1.02; d[i] = b * 3.5; }
    const src = actx.createBufferSource(); src.buffer = buf; src.loop = true;
    const lp = actx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 500;
    const osc = actx.createOscillator(); osc.type = 'sawtooth'; osc.frequency.value = 52;
    const og = actx.createGain(); og.gain.value = 0.05;
    const g = actx.createGain(); g.gain.value = 0;
    src.connect(lp); osc.connect(og); og.connect(lp); lp.connect(g); g.connect(actx.destination);
    src.start(); osc.start();
    eng = { lp, g, osc, noise: buf };
  }
  function engineSound() {
    if (!eng) return;
    const t = actx.currentTime;
    eng.g.gain.setTargetAtTime(soundOn && !crashed ? 0.16 + boostAmt * 0.16 : 0, t, 0.1);
    eng.lp.frequency.setTargetAtTime(380 + boostAmt * 900 + speed, t, 0.15);
    eng.osc.frequency.setTargetAtTime(48 + boostAmt * 22, t, 0.2);
  }
  function sfx(kind, vol) {
    if (!soundOn || !actx) return;
    const t = actx.currentTime;
    if (kind === 'ring' || kind === 'pop') {
      const notes = kind === 'ring' ? [880, 1320] : [660, 990, 1320];
      notes.forEach((f, i) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = 'square'; o.frequency.value = f; o.connect(g); g.connect(actx.destination); g.gain.setValueAtTime(0.0001, t + i * 0.06); g.gain.linearRampToValueAtTime(0.06 * vol, t + i * 0.06 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + i * 0.06 + 0.14); o.start(t + i * 0.06); o.stop(t + i * 0.06 + 0.16); });
      return;
    }
    const src = actx.createBufferSource(); src.buffer = eng.noise;
    const f = actx.createBiquadFilter(), g = actx.createGain();
    src.connect(f); f.connect(g); g.connect(actx.destination);
    if (kind === 'boom') { f.type = 'lowpass'; f.frequency.setValueAtTime(900, t); f.frequency.exponentialRampToValueAtTime(80, t + 1.4); g.gain.setValueAtTime(0.9 * vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + 1.5); src.start(t, Math.random()); src.stop(t + 1.6); }
    else if (kind === 'launch') { f.type = 'bandpass'; f.frequency.setValueAtTime(400, t); f.frequency.exponentialRampToValueAtTime(2400, t + 0.6); g.gain.setValueAtTime(0.5 * vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.9); src.start(t, Math.random()); src.stop(t + 1); }
    else { f.type = 'bandpass'; f.frequency.setValueAtTime(700, t); f.frequency.exponentialRampToValueAtTime(1500, t + 0.4); f.frequency.exponentialRampToValueAtTime(600, t + 0.8); g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.2 * vol, t + 0.3); g.gain.exponentialRampToValueAtTime(0.001, t + 0.9); src.start(t, Math.random()); src.stop(t + 1); }
  }

  // ================================================================ déroulé d'une partie

        if (!crashed) {
          let best = null, bd = 1e9;
          for (const b of beacons) if (b.visible) { const d = b.position.distanceTo(pos); if (d < bd) { bd = d; best = b; } }
          if (best) {
            const h = houses[best.userData.house], tx = near(h.x, pos.x), tz = near(h.z, pos.z);
            const dx = tx - pos.x, dz = tz - pos.z, hd = Math.hypot(dx, dz);
            input.x = clamp(angDiff(Math.atan2(dx, -dz), heading) * 2.4, -1, 1);
            const wantY = Math.max(groundAt(pos.x, pos.z), h.y) + 140;
            input.y = clamp((pos.y - wantY) / 80 + pitch * 2, -1, 1);
            if (i % 12 === 0 && nearestBeacon(predictGift()).d < 26) { fire(); drops++; }
            if (hd < 150) { input.x = 1; }
          }
        }
        step(STEP); updateCamera(STEP);
      }
      return { drops };
    },
    // pilote d'essai : vise l'anneau actif (sert à régler les mentions)
    bot(n, opts) {
      opts = opts || {};
      for (let i = 0; i < n; i++) {
        if (mission.on && !crashed) {
          const r = rings[course.active].position;
          const dx = r.x - pos.x, dz = r.z - pos.z, hd = Math.hypot(dx, dz);
          const want = Math.atan2(dx, -dz), dh = angDiff(want, heading);
          const wantP = Math.atan2(r.y - pos.y, hd);
          input.x = clamp(dh * 2.4, -1, 1);
          input.y = clamp(-(wantP - pitch) * 3, -1, 1);
          if (opts.fire && i % 30 === 0) {
            if (TH.target === 'balloons' && lockTarget) fire();
            if (TH.target === 'gifts' && nearestBeacon(predictGift()).d < 28) fire();
          }
        }
        step(STEP); updateCamera(STEP);
        if (!mission.on) break;
      }
    }
  };
  requestAnimationFrame((t) => { last = t; requestAnimationFrame(frame); });
})();
</script>
